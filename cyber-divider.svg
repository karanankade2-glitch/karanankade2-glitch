<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 16" fill="none" width="100%">
  <defs>
    <linearGradient id="cyber-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f3ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00ff88" stop-opacity="1" />
      <stop offset="80%" stop-color="#00f3ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
